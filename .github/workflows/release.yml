# Publishes a release for every new version: when VERSION in src/aliasmaker_core.py changes
# on main, this tests the code, builds every package and attaches them to a new release:
# the installer, a pacman package, AppImages of the app and of Alias Maker Debug, and the
# AUR files. If the AUR_SSH_PRIVATE_KEY secret is set, it also updates the AUR package.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: |
          version=$(python3 -c "import sys; sys.path.insert(0, 'src'); import aliasmaker_core as c; print(c.VERSION)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Version $version is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install fish for the shell tests
        run: sudo apt-get update -q && sudo apt-get install -y -q fish
      - name: Run the tests
        run: python3 -m unittest discover -s tests
      - name: Build the installer and the AppImages
        run: |
          packaging/build-installer.sh
          packaging/build-appimage.sh
          cp "dist/alias-maker-${{ needs.check.outputs.version }}-installer.run" dist/alias-maker-installer.run
          rm dist/appimagetool
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  arch:
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Build the pacman package and the AUR files
        run: |
          pacman -Syu --noconfirm python
          bash packaging/build-arch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          include-hidden-files: true
          path: |
            dist/*.pkg.tar.zst
            dist/aur/

  publish:
    needs: [check, build, arch]
    runs-on: ubuntu-24.04
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: arch
          path: dist/
      - name: Publish the release
        run: |
          v="${{ needs.check.outputs.version }}"
          tar -czf dist/alias-maker-aur.tar.gz -C dist/aur PKGBUILD .SRCINFO
          cat > notes.md <<EOF
          Alias Maker $v for CachyOS. This is a test version: please report anything that goes wrong.

          **Pick one way to install:**

          | File | How |
          |---|---|
          | \`alias-maker-installer.run\` | Easiest. In a terminal: \`bash ~/Downloads/alias-maker-installer.run\`. It installs what's needed and builds the package for you. |
          | \`alias-maker-$v-1-any.pkg.tar.zst\` | The ready-made CachyOS / Arch package: \`sudo pacman -U ~/Downloads/alias-maker-$v-1-any.pkg.tar.zst\` |
          | \`Alias-Maker-x86_64.AppImage\` | Nothing to install. Needs GTK 4 and VTE (CachyOS: \`sudo pacman -S vte4 python-gobject\`). Make it runnable (right-click → Properties → Allow executing, or \`chmod +x\`), then double-click it. |
          | \`Alias-Maker-Debug-x86_64.AppImage\` | Alias Maker Debug on its own, for when the app won't start. |
          | \`alias-maker-aur.tar.gz\` | The AUR files (PKGBUILD and .SRCINFO). |

          **If something goes wrong:** open **Alias Maker Debug** (from your app launcher, ☰ → Report a Problem, \`aliasmaker-debug\`, or the Debug AppImage), click **Save Everything for the Developer**, and send the file it makes. It never includes what you typed in the terminal, and you can read every word before sending it.
          EOF
          gh release create "v$v" \
            "dist/alias-maker-$v-installer.run" dist/alias-maker-installer.run \
            dist/alias-maker-$v-*.pkg.tar.zst \
            dist/Alias-Maker-x86_64.AppImage dist/Alias-Maker-Debug-x86_64.AppImage \
            "dist/alias-maker-$v.tar.gz" dist/alias-maker-aur.tar.gz \
            --target "$GITHUB_SHA" --title "Alias Maker $v" \
            --notes-file notes.md --generate-notes

      - name: Update the AUR package
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/alias-maker.git aur-repo
          cp dist/aur/PKGBUILD dist/aur/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "theStyleWithin"
          git config user.email "135564329+theStyleWithin@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "The AUR package is already up to date."
          else
            git commit -m "Update to ${{ needs.check.outputs.version }}"
            git push origin HEAD:master
          fi
