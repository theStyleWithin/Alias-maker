# Publishes a release for every new version: when VERSION in src/aliasmaker_core.py changes
# on main, this tests the code, builds every package and attaches them to a new release:
# the installer, a pacman package, AppImages of the app and of Alias Maker Debug, and hand-off
# kits for whoever wants to publish it on the AUR or Flathub (see packaging/handoff/).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # signing the build provenance
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: |
          version=$(python3 -c "import sys; sys.path.insert(0, 'src'); import aliasmaker_core as c; print(c.VERSION)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Version $version is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install fish for the shell tests
        run: sudo apt-get update -q && sudo apt-get install -y -q fish
      - name: Run the tests
        run: python3 -m unittest discover -s tests
      - name: Build the installer and the AppImages
        run: |
          packaging/build-installer.sh
          packaging/build-appimage.sh
          packaging/build-handoff.sh
          cp "dist/alias-maker-${{ needs.check.outputs.version }}-installer.run" dist/alias-maker-installer.run
          rm dist/appimagetool
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  arch:
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Build the pacman package and the AUR files
        run: |
          pacman -Syu --noconfirm python
          bash packaging/build-arch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          include-hidden-files: true
          path: |
            dist/*.pkg.tar.zst
            dist/aur/

  publish:
    needs: [check, build, arch]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: arch
          path: dist/
      - name: Gather the files and their checksums
        run: |
          v="${{ needs.check.outputs.version }}"
          mv dist/aur dist/alias-maker-aur-handoff
          tar -czf dist/alias-maker-aur-handoff.tar.gz -C dist alias-maker-aur-handoff
          mkdir release
          cp "dist/alias-maker-$v-installer.run" dist/alias-maker-installer.run \
            dist/alias-maker-$v-*.pkg.tar.zst \
            dist/Alias-Maker-x86_64.AppImage dist/Alias-Maker-Debug-x86_64.AppImage \
            "dist/alias-maker-$v.tar.gz" dist/alias-maker-aur-handoff.tar.gz dist/alias-maker-flathub-handoff.tar.gz \
            release/
          (cd release && sha256sum -- * > SHA256SUMS)

      # A signed record that GitHub built these files from this repo's source, so anyone can
      # check a download is genuine (gh attestation verify <file> --repo theStyleWithin/Alias-maker).
      - name: Prove where the files came from
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*

      - name: Publish the release
        run: |
          v="${{ needs.check.outputs.version }}"
          cat > body.md <<EOF
          Alias Maker $v for CachyOS. This is a test version: please report anything that goes wrong.

          **Pick one way to install:**

          | File | How |
          |---|---|
          | \`alias-maker-installer.run\` | Easiest. In a terminal: \`bash ~/Downloads/alias-maker-installer.run\`. It installs what's needed and builds the package for you. |
          | \`alias-maker-$v-1-any.pkg.tar.zst\` | The ready-made CachyOS / Arch package: \`sudo pacman -U ~/Downloads/alias-maker-$v-1-any.pkg.tar.zst\` |
          | \`Alias-Maker-x86_64.AppImage\` | Nothing to install. Needs GTK 4 and VTE (CachyOS: \`sudo pacman -S vte4 python-gobject\`). Make it runnable (right-click → Properties → Allow executing, or \`chmod +x\`), then double-click it. |
          | \`Alias-Maker-Debug-x86_64.AppImage\` | Alias Maker Debug on its own, for when the app won't start. |
          | \`alias-maker-aur-handoff.tar.gz\`, \`alias-maker-flathub-handoff.tar.gz\` | For packagers: Alias Maker isn't published on the AUR or Flathub by its author. Anyone is welcome to; these kits are a head start (read the README inside). |

          **If something goes wrong:** open **Alias Maker Debug** (from your app launcher, ☰ → Report a Problem, \`aliasmaker-debug\`, or the Debug AppImage), click **Save Everything for the Developer**, and send the file it makes. It never includes what you typed in the terminal, and you can read every word before sending it.

          **Antivirus warnings:** a few antivirus engines flag AppImages in general, because the small AppImage launcher inside every one looks like a packed program to them. Alias Maker's AppImage is AppImage's official launcher plus Alias Maker's own Python and shell files, nothing else. To check a download is the genuine one, built by GitHub from this repo's public source:

              sha256sum -c SHA256SUMS --ignore-missing
              gh attestation verify Alias-Maker-x86_64.AppImage --repo theStyleWithin/Alias-maker

          If you'd rather avoid AppImages, the installer and the pacman package are plain scripts and files you can read.
          EOF
          # The not-tested-yet warning goes at the top and again at the end.
          { cat packaging/release-warning.md; echo; cat body.md; echo; cat packaging/release-warning.md; } > notes.md
          gh release create "v$v" release/* \
            --target "$GITHUB_SHA" --title "Alias Maker $v" \
            --notes-file notes.md --generate-notes

      - name: Put the warning on older releases too
        run: |
          warning=$(cat packaging/release-warning.md)
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            body=$(gh release view "$tag" --json body --jq .body)
            case "$body" in *"has not been tested on a real machine"*) continue ;; esac
            printf '%s\n\n%s\n\n%s\n' "$warning" "$body" "$warning" > old-notes.md
            gh release edit "$tag" --notes-file old-notes.md
          done

